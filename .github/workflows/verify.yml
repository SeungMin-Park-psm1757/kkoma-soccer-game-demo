name: Verify game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check game syntax
        run: node --check game.js

      - name: Check ending content syntax
        run: node --check ending-content.js

      - name: Check test syntax
        run: node --check tests/mobile-logic.mjs

      - name: Run mobile logic tests
        run: node tests/mobile-logic.mjs
