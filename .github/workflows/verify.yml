name: Verify game

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python image QA
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install sprite QA dependency
        run: python -m pip install Pillow

      - name: Check game syntax
        run: node --check game.js

      - name: Check ending content syntax
        run: node --check ending-content.js

      - name: Check test syntax
        run: node --check tests/mobile-logic.mjs

      - name: Check asset test syntax
        run: node --check tests/assets-integrity.mjs

      - name: Run mobile logic tests
        run: node tests/mobile-logic.mjs

      - name: Run asset integrity tests
        run: node tests/assets-integrity.mjs

      - name: Run sprite alignment QA
        run: python tests/sprite-qa.py
