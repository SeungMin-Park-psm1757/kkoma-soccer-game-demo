name: Visual QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'game.js'
      - 'game.css'
      - 'index.html'
      - 'assets/players/**'
      - 'tests/visual-qa.mjs'
      - '.github/workflows/visual-qa.yml'

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser driver
        run: npm install --no-save playwright-core@1.55.0
      - name: Start static server
        run: |
          mkdir -p visual-qa
          python3 -m http.server 8000 >/tmp/kkoma-http.log 2>&1 &
      - name: Capture mobile views
        run: node tests/visual-qa.mjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mobile-visual-qa
          path: visual-qa/
