<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#042f27">
    <title>꼬마 축구 월드컵</title>
    <link rel="stylesheet" href="game.css">
  </head>
  <body>
    <main id="app" aria-label="꼬마 축구 월드컵 게임">
      <header id="hud" class="hud hidden">
        <button id="back-button" class="icon-button" aria-label="메뉴로">⌂</button>
        <div class="scoreboard">
          <span id="home-team-label">우리 팀</span>
          <strong><span id="home-score">0</span><i>:</i><span id="away-score">0</span></strong>
          <span id="away-team-label">상대 팀</span>
        </div>
        <div class="clockbox"><span id="period-label">전반</span><strong id="clock">75</strong></div>
        <button id="pause-button" class="icon-button" aria-label="일시정지">Ⅱ</button>
      </header>
      <canvas id="pitch" aria-label="축구 경기장"></canvas>
      <div id="attack-direction" class="attack-direction hidden" aria-live="polite"></div>
      <div id="hint" class="hint hidden" aria-live="polite"></div>
      <section id="screen" class="screen" aria-live="polite"></section>
      <div id="drag-hint" class="drag-hint hidden">끌고 있으면 달리기 · 손 떼면 패스</div>
      <button id="tackle-button" class="tackle-button hidden" type="button" aria-label="상대가 공을 가졌을 때 태클">🛡️ <span>태클</span></button>
    </main>
    <script src="game.js" defer></script>
  </body>
</html>
